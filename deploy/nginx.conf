map_hash_bucket_size 128;
include /usr/share/nginx/html/_agent-markdown/agent-markdown.conf;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # 容器端口与外部端口可能不同，目录跳转保留客户端当前协议和端口。
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        if ($agent_markdown_uri != "") {
            rewrite ^ $agent_markdown_uri last;
        }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
        add_header Content-Signal "search=yes, ai-input=yes, ai-train=yes" always;
        add_header Link '</sitemap.xml>; rel="alternate"; type="application/xml"';
    }

    location ^~ /_agent-markdown/ {
        internal;
        types { }
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
        add_header Content-Signal "search=yes, ai-input=yes, ai-train=yes" always;
        add_header Link '</sitemap.xml>; rel="alternate"; type="application/xml"';
    }
}
